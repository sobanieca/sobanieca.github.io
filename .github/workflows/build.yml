name: Build and Deploy Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install imp
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://imp-ui.com/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          deno fmt --check
          imp fmt --check

      - name: Lint
        run: deno lint

      - name: Check for TODOs in articles
        run: |
          if grep -r 'TODO:' --include='*.md' articles/; then
            echo "Found TODO: markers in markdown files. Please resolve them before merging."
            exit 1
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate content
        run: deno task content

      - name: Lint the app
        run: imp lint

      # Builds with the prod environment, which turns the imp-aly analytics on
      - name: Build with Deno and imp
        run: deno task publish

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
